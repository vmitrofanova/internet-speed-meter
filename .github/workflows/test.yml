name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install ".[dev]"
      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile all modules
        run: python -m compileall -q internet_speed_meter speed_meter.py
