[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-speed-meter"
version = "2.0.0"
description = "Sequential HTTP download speed meter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vmitrofanova" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
]

[project.scripts]
speed-meter = "internet_speed_meter.cli:main"

[tool.setuptools.packages.find]
include = ["internet_speed_meter*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
# Russian CLI messages intentionally contain Cyrillic look-alike characters.
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["internet_speed_meter", "speed_meter.py"]
